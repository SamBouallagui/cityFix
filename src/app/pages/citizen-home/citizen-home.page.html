<ion-header>
  <ion-toolbar color="primary">
    <ion-title>My Reports</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">
        <ion-icon name="log-out-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- pull down to refresh gesture -->
  <ion-refresher slot="fixed" (ionRefresh)="loadReports($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="empty-state" *ngIf="reports.length === 0">
    <ion-icon name="document-text-outline"></ion-icon>
    <p>You haven't submitted any reports yet.</p>
  </div>

  <ion-card *ngFor="let report of reports" class="report-card">
    <img *ngIf="report.photoUrl" [src]="report.photoUrl" class="report-photo" />
    <ion-card-content>
      <div class="report-top">
        <ion-icon [name]="iconFor(report.category)" class="category-icon"></ion-icon>
        <div class="report-info">
          <h3>{{ report.title }}</h3>
          <p class="report-date">{{ report.createdAt | date:'medium' }}</p>
        </div>
        <ion-badge [color]="badgeColor(report.status)">{{ statusLabel(report.status) }}</ion-badge>
      </div>
      <p class="report-desc" *ngIf="report.description">{{ report.description }}</p>
    </ion-card-content>
  </ion-card>
  <!-- floating action button for creating a new report -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button color="secondary" routerLink="/new-report">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
